name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（如 1.3.0，会覆盖 Cargo.toml 的 version）"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  publish:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version in Cargo.toml
        run: sed -i "s/^version = .*/version = \"${{ steps.v.outputs.version }}\"/" Cargo.toml

      - name: Verify package
        run: cargo package

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" -R ${{ github.repository }} \
            --title "dm-pure v$VERSION" \
            --notes "dm-pure $VERSION（纯 Rust 达梦 DM8 驱动，已发布到 crates.io）" \
            || echo "Release 可能已存在，忽略"
